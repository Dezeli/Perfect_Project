plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.perfectocr'
version = '0.1.0'

dependencies {
  implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}

android {
  namespace "expo.modules.perfectocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
